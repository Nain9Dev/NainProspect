name: Deploy Live Demo

on:
  push:
    branches:
      - main
    paths:
      - 'ProspectAI.Client/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: Nain9Dev/.github/.github/workflows/reusable-pages-deploy.yml@main
    with:
      working-directory: "ProspectAI.Client"
      dist-path: "dist"
      build-command: "npm run build"
